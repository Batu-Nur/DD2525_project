<html>

<body> 
    <form  onsubmit="submitted()">
        <input id="form",type="text">
        <button type="submit">Submit Text</button>

    </form>
   

</body>


<script src="poc.js"></script>
<script>
    Module.onRuntimeInitialized = function () {
        write_to_web = Module.cwrap('write_to_web',
                            'string',
                            ['string']);}
</script>

<script>
    function submitted(){
        event.preventDefault();
        var data = document.getElementById("form").value 
        console.log("data",data)
        var ret  = write_to_web(data)
        console.log("cmd", ret)
    }
</script>
    
</html>
